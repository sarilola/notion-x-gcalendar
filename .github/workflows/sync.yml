name: Sync Notion DB to Google Calendar

on:
  schedule:
    # runs every hour at minute 0 — hourly crons are respected consistently
    # by GitHub's scheduler unlike */30 which gets queued and delayed for hours.
    # the sync script queries a 90-minute window so no changes are missed.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run sync script
        run: npx ts-node --project tsconfig.json sync.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID1: ${{ secrets.DATABASE_ID1 }}
          DATABASE_ID2: ${{ secrets.DATABASE_ID2 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}