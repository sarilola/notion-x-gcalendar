name: Keepalive Workflow

on:
  schedule:
    # Runs once a week every Sunday at midnight (UTC) to keep the repository active
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
